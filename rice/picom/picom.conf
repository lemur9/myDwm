# myDwm companion Picom configuration
# Target: current upstream Picom; dual_kawase requires a GLX-capable build.

backend = "glx";
vsync = true;
use-damage = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Soft shadows give the gaps depth without producing a heavy halo.
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.34;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-color = "#080810";
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "name = 'Notification'",
  "class_g = 'Conky'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Keep normal windows crisp. Transparency is provided by ARGB-aware clients
# (this dwm bar, Rofi and Dunst), rather than fading all text with opacity-rule.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

fading = true;
fade-in-step = 0.045;
fade-out-step = 0.045;
fade-delta = 4;
no-fading-openclose = false;

corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "fullscreen"
];

blur: {
  method = "dual_kawase";
  strength = 5;
};
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'slop'",
  "name = 'cava'"
];

focus-exclude = [
  "class_g = 'Cairo-clock'"
];

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.96; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
  notification = { shadow = true; };
};
