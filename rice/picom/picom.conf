# dwm companion Picom configuration
# Target: current upstream Picom; dual_kawase requires a GLX-capable build.

backend = "glx";
vsync = true;
use-damage = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Soft shadows give the gaps depth without producing a heavy halo.
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.34;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-color = "#080810";
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'dwm'",
  "name = 'Notification'",
  "class_g = 'Conky'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Keep normal windows crisp. Transparency is provided by ARGB-aware clients
# (this dwm bar, Rofi and Dunst), rather than fading all text with opacity-rule.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

fading = true;
fade-in-step = 0.045;
fade-out-step = 0.045;
fade-delta = 4;
no-fading-openclose = false;

# dwm 自己画胶囊的圆角（bar 窗口是 ARGB，圆角外的像素完全透明），
# 这里不能再用 corner-radius 去切 dwm 的窗口，否则圆角会被切两遍。
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'dwm'",
  "fullscreen"
];

blur: {
  method = "dual_kawase";
  strength = 5;
};
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
# 悬浮胶囊 bar：Picom 的模糊是按“窗口矩形”而不是按像素 alpha 生效的，
# 所以 bar 窗口整条（包括胶囊之间的空隙和四周留白）都会被模糊。
# 深色平滑壁纸下看不出来，胶囊还能拿到真正的磨砂玻璃质感，因此默认保留模糊。
# 如果你的壁纸细节很多，看到胶囊之间有一条模糊矩形带，就把下面这行取消注释：
# blur-background-exclude 里加上 "class_g = 'dwm'"
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "name = 'cava'"
];

focus-exclude = [
  "class_g = 'Cairo-clock'"
];

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.96; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
  notification = { shadow = true; };
};
