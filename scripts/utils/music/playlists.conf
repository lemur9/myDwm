# 歌单配置：每行一个歌单，字段使用 | 分隔，不要加引号。
#
# 格式：
# 显示名称|歌单 URL 或 ID|本地目录|更新策略
#
# 显示名称：
#   仅用于同步进度和结果通知，可填写任意简短名称，不能包含 |。
#
# 歌单 URL 或 ID：
#   可填写完整的网易云歌单链接，也可只填写数字歌单 ID。
#
# 本地目录：
#   相对于 ~/Music 的一级目录名，同时用于 yun 的输出格式。
#   可使用中文和空格，但不能为空，不能包含 /、.. 或 |。
#
# 更新策略：
#   merge    保留现有目录，只下载新增或不完整的歌曲，不删除旧文件。
#   replace  下载前备份整个目录；成功后删除备份，失败时恢复旧目录。
#            适合内容经常整体变化的排行榜。
#
# update_playlist.sh 会对所有歌单统一使用 --skip-trial，试听歌曲不会下载。
# 空行和以 # 开头的行会被忽略。

热歌榜|https://music.163.com/#/playlist?id=3778678|热歌榜|replace
民谣歌单|https://music.163.com/#/playlist?id=919939187|民谣歌单|merge
